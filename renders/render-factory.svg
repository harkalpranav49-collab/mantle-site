<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Factory hall with a press station and conveyor line">
  <defs>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090B0E"/><stop offset="1" stop-color="#14181D"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20252B"/><stop offset="1" stop-color="#0E1115"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2C333B"/><stop offset=".45" stop-color="#4A535D"/><stop offset="1" stop-color="#20252B"/>
    </linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A535D"/><stop offset="1" stop-color="#2C333B"/>
    </linearGradient>
    <radialGradient id="haze" cx=".5" cy=".43" r=".6">
      <stop offset="0" stop-color="#F5F5F3" stop-opacity=".12"/><stop offset="1" stop-color="#F5F5F3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F5F3" stop-opacity=".14"/><stop offset="1" stop-color="#F5F5F3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- hall -->
  <polygon points="0,0 1600,0 1040,300 560,300" fill="url(#ceil)"/>
  <polygon points="0,0 560,300 560,560 0,1000" fill="#101318"/>
  <polygon points="1600,0 1040,300 1040,560 1600,1000" fill="#0E1115"/>
  <polygon points="0,1000 560,560 1040,560 1600,1000" fill="url(#floor)"/>
  <rect x="560" y="300" width="480" height="260" fill="#14181D"/>
  <!-- back wall: bay door + windows -->
  <rect x="700" y="380" width="200" height="180" fill="#20252B"/>
  <g stroke="#2C333B" stroke-width="2"><path d="M700 400H900M700 420H900M700 440H900M700 460H900M700 480H900M700 500H900M700 520H900M700 540H900"/></g>
  <g fill="#F5F5F3" opacity=".18"><rect x="590" y="320" width="80" height="34"/><rect x="930" y="320" width="80" height="34"/></g>

  <!-- trusses -->
  <g stroke="#2C333B" stroke-width="3" fill="none">
    <path d="M0 0L560 300M1600 0L1040 300"/>
    <path d="M140 75H1460M280 150H1320M420 225H1180"/>
    <path d="M140 75L280 150M420 75L280 150M700 75L560 150M980 75L1040 150M1320 150L1460 75M1180 75L1320 150"/>
  </g>
  <!-- high-bay lights receding to the vanishing point -->
  <g fill="#F5F5F3">
    <rect x="650" y="321" width="35" height="2.5"/><rect x="915" y="321" width="35" height="2.5"/>
    <rect x="560" y="257" width="56" height="3.5"/><rect x="984" y="257" width="56" height="3.5"/>
    <rect x="470" y="193" width="77" height="4.5"/><rect x="1053" y="193" width="77" height="4.5"/>
    <rect x="350" y="107" width="105" height="6"/><rect x="1145" y="107" width="105" height="6"/>
    <rect x="230" y="21" width="133" height="7.5"/><rect x="1237" y="21" width="133" height="7.5"/>
  </g>
  <rect width="1600" height="1000" fill="url(#haze)"/>

  <!-- floor: safety lanes converging -->
  <g fill="#4169E1">
    <polygon points="740,560 748,560 330,1000 300,1000"/>
    <polygon points="852,560 860,560 1300,1000 1270,1000"/>
  </g>
  <g stroke="#2C333B" stroke-width="2"><path d="M800 560V1000M620 640H980M500 734H1100M330 866H1270"/></g>
  <polygon points="740,560 860,560 1300,1000 300,1000" fill="url(#sheen)" opacity=".5"/>

  <!-- conveyor receding on the left -->
  <polygon points="40,880 330,880 690,590 640,590" fill="#2C333B"/>
  <polygon points="40,880 330,880 330,920 40,920" fill="#20252B"/>
  <polygon points="330,880 690,590 690,604 330,920" fill="#14181D"/>
  <g stroke="#14181D" stroke-width="3"><path d="M110 822H384M188 759H453M256 704H519M314 657H572M362 618H618"/></g>
  <g fill="#14181D"><rect x="70" y="920" width="10" height="70"/><rect x="290" y="920" width="10" height="70"/></g>
  <!-- parts on the belt -->
  <polygon points="150,812 240,812 252,790 162,790" fill="#5C6873"/><rect x="150" y="812" width="90" height="26" fill="#3A424B"/>
  <polygon points="330,682 380,682 388,668 338,668" fill="#5C6873"/><rect x="330" y="682" width="50" height="15" fill="#3A424B"/>
  <polygon points="470,594 500,594 505,586 475,586" fill="#5C6873"/>

  <!-- press machine, foreground right -->
  <ellipse cx="1230" cy="930" rx="300" ry="26" fill="#090B0E" opacity=".7"/>
  <rect x="980" y="860" width="500" height="60" fill="#20252B"/>
  <rect x="980" y="860" width="500" height="4" fill="#5C6873"/>
  <rect x="1010" y="330" width="70" height="530" fill="url(#steel)"/>
  <rect x="1380" y="330" width="70" height="530" fill="url(#steel)"/>
  <rect x="990" y="270" width="480" height="96" fill="url(#steelV)"/>
  <rect x="990" y="270" width="480" height="4" fill="#A3ADB6"/>
  <rect x="1150" y="366" width="160" height="210" fill="url(#steel)"/>
  <rect x="1140" y="576" width="180" height="26" fill="#5C6873"/>
  <rect x="1110" y="780" width="240" height="80" fill="#3A424B"/>
  <rect x="1110" y="780" width="240" height="4" fill="#A3ADB6"/>
  <!-- guard: translucent, blue-edged -->
  <rect x="1088" y="380" width="284" height="400" fill="#4169E1" fill-opacity=".07" stroke="#4169E1" stroke-width="3"/>
  <g stroke="#4169E1" stroke-opacity=".45" stroke-width="1.5"><path d="M1088 480H1372M1088 580H1372M1088 680H1372M1230 380V780"/></g>
  <!-- rim light on the columns -->
  <rect x="1078" y="330" width="2" height="530" fill="#BFC5CB"/>
  <rect x="1448" y="330" width="2" height="530" fill="#BFC5CB"/>
  <!-- control panel -->
  <rect x="1490" y="560" width="10" height="300" fill="#2C333B"/>
  <rect x="1460" y="470" width="120" height="110" fill="#2C333B"/>
  <rect x="1474" y="484" width="92" height="40" fill="#090B0E"/>
  <rect x="1482" y="498" width="50" height="6" fill="#4169E1"/>
  <rect x="1482" y="510" width="34" height="4" fill="#788895"/>
  <circle cx="1494" cy="552" r="11" fill="#F5F5F3"/><circle cx="1540" cy="552" r="11" fill="#4169E1"/>

  <!-- operator -->
  <g fill="#090B0E">
    <circle cx="920" cy="684" r="16"/>
    <path d="M896 704H944L952 820H888Z"/>
    <rect x="896" y="820" width="20" height="80"/><rect x="924" y="820" width="20" height="80"/>
  </g>
  <path d="M902 676A18 18 0 0 1 938 676Z" fill="#F5F5F3"/>
  <rect x="944" y="736" width="26" height="36" fill="#2C333B" stroke="#788895"/>
</svg>
