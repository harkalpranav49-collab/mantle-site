<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Furnished living room at dusk with a city view">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1115"/><stop offset=".7" stop-color="#20252B"/><stop offset="1" stop-color="#3A4A6E"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C333B"/><stop offset="1" stop-color="#14181D"/>
    </linearGradient>
    <linearGradient id="lwall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D3D7DB"/><stop offset="1" stop-color="#ECEDEC"/>
    </linearGradient>
    <linearGradient id="rwall" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#BFC5CB"/><stop offset="1" stop-color="#DADDDF"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F5F3" stop-opacity=".16"/><stop offset="1" stop-color="#F5F5F3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- shell -->
  <polygon points="0,0 1600,0 1180,250 420,250" fill="#E4E6E7"/>
  <polygon points="0,0 420,250 420,700 0,1000" fill="url(#lwall)"/>
  <polygon points="1600,0 1180,250 1180,700 1600,1000" fill="url(#rwall)"/>
  <polygon points="0,1000 420,700 1180,700 1600,1000" fill="url(#floor)"/>
  <rect x="420" y="250" width="760" height="450" fill="#F5F5F3"/>
  <!-- ceiling details -->
  <polygon points="300,72 1300,72 1236,110 364,110" fill="#D9DCDE"/>
  <g fill="#FFFFFF"><ellipse cx="620" cy="150" rx="16" ry="4"/><ellipse cx="980" cy="150" rx="16" ry="4"/><ellipse cx="520" cy="205" rx="11" ry="3"/><ellipse cx="1080" cy="205" rx="11" ry="3"/></g>

  <!-- window wall with city -->
  <rect x="470" y="282" width="660" height="418" fill="url(#dusk)"/>
  <g fill="#14181D">
    <rect x="480" y="520" width="60" height="180"/><rect x="550" y="470" width="44" height="230"/><rect x="606" y="560" width="70" height="140"/>
    <rect x="690" y="430" width="52" height="270"/><rect x="752" y="540" width="80" height="160"/><rect x="842" y="500" width="40" height="200"/>
    <rect x="892" y="580" width="66" height="120"/><rect x="968" y="455" width="56" height="245"/><rect x="1034" y="545" width="90" height="155"/>
  </g>
  <g fill="#F5F5F3" opacity=".7">
    <rect x="560" y="490" width="5" height="5"/><rect x="575" y="520" width="5" height="5"/><rect x="700" y="460" width="5" height="5"/><rect x="720" y="510" width="5" height="5"/><rect x="705" y="570" width="5" height="5"/>
    <rect x="980" y="480" width="5" height="5"/><rect x="1000" y="530" width="5" height="5"/><rect x="985" y="600" width="5" height="5"/><rect x="770" y="570" width="5" height="5"/><rect x="1060" y="580" width="5" height="5"/>
  </g>
  <circle cx="1002" cy="440" r="3" fill="#4169E1"/>
  <g fill="#0E1115"><rect x="466" y="278" width="668" height="6"/><rect x="466" y="278" width="6" height="422"/><rect x="1128" y="278" width="6" height="422"/><rect x="687" y="278" width="4" height="422"/><rect x="909" y="278" width="4" height="422"/></g>
  <!-- curtain -->
  <rect x="1134" y="262" width="34" height="438" fill="#ECEDEC"/>
  <g stroke="#D3D7DB" stroke-width="2"><path d="M1142 262V700M1152 262V700M1160 262V700"/></g>

  <!-- floor reflection of window -->
  <polygon points="470,700 1130,700 1200,860 400,860" fill="url(#refl)"/>
  <!-- rug -->
  <polygon points="330,770 1250,770 1430,930 150,930" fill="#3A424B"/>
  <polygon points="330,770 1250,770 1430,930 150,930" fill="none" stroke="#5C6873" stroke-width="2"/>

  <!-- art on left wall -->
  <polygon points="120,230 300,290 300,520 120,520" fill="#F5F5F3" stroke="#BFC5CB" stroke-width="3"/>
  <polygon points="142,262 280,308 280,498 142,498" fill="#20252B"/>
  <polygon points="142,420 280,380 280,498 142,498" fill="#4169E1"/>
  <circle cx="214" cy="350" r="22" fill="#F5F5F3" opacity=".85"/>

  <!-- sofa -->
  <rect x="340" y="660" width="500" height="80" rx="10" fill="#5C6873"/>
  <rect x="340" y="730" width="500" height="70" rx="8" fill="#788895"/>
  <rect x="360" y="736" width="230" height="44" rx="8" fill="#8A97A2"/>
  <rect x="598" y="736" width="226" height="44" rx="8" fill="#8A97A2"/>
  <rect x="316" y="690" width="44" height="120" rx="10" fill="#5C6873"/>
  <rect x="822" y="690" width="44" height="120" rx="10" fill="#5C6873"/>
  <rect x="390" y="680" width="80" height="60" rx="10" fill="#F5F5F3" opacity=".9"/>
  <rect x="720" y="684" width="72" height="56" rx="10" fill="#4169E1"/>
  <g fill="#14181D"><rect x="340" y="810" width="8" height="16"/><rect x="832" y="810" width="8" height="16"/></g>
  <ellipse cx="590" cy="834" rx="290" ry="14" fill="#090B0E" opacity=".35"/>

  <!-- coffee table -->
  <ellipse cx="1010" cy="826" rx="190" ry="30" fill="#090B0E" opacity=".35"/>
  <rect x="860" y="788" width="300" height="14" rx="3" fill="#F5F5F3"/>
  <rect x="870" y="802" width="280" height="6" fill="#BFC5CB"/>
  <g fill="#20252B"><rect x="884" y="808" width="6" height="22"/><rect x="1130" y="808" width="6" height="22"/></g>
  <rect x="940" y="770" width="70" height="18" fill="#20252B"/>
  <rect x="950" y="760" width="56" height="10" fill="#788895"/>
  <circle cx="1080" cy="778" r="10" fill="#14181D"/>

  <!-- pendant -->
  <path d="M1010 0V470" stroke="#20252B" stroke-width="2"/>
  <circle cx="1010" cy="520" r="120" fill="url(#lamp)"/>
  <path d="M970 506H1050L1036 470H984Z" fill="#20252B"/>
  <ellipse cx="1010" cy="506" rx="40" ry="5" fill="#FFFFFF"/>

  <!-- floor lamp + plant -->
  <path d="M1300 700V930" stroke="#20252B" stroke-width="4"/>
  <ellipse cx="1300" cy="932" rx="36" ry="7" fill="#20252B"/>
  <path d="M1260 640H1340L1326 700H1274Z" fill="#F5F5F3"/>
  <circle cx="1300" cy="680" r="90" fill="url(#lamp)"/>
  <path d="M190 860H262L252 960H200Z" fill="#20252B"/>
  <g fill="#2C333B"><path d="M226 860C180 800 190 740 214 700C230 760 236 810 226 860Z"/><path d="M226 860C250 790 290 760 320 740C300 800 270 840 226 860Z"/><path d="M226 860C200 820 150 800 120 790C150 830 190 860 226 860Z"/></g>
</svg>
