<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Residential towers at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090B0E"/><stop offset=".55" stop-color="#12161B"/><stop offset=".86" stop-color="#20252B"/><stop offset="1" stop-color="#2A3446"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2027"/><stop offset=".5" stop-color="#252B32"/><stop offset="1" stop-color="#171B21"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14181D"/><stop offset="1" stop-color="#090B0E"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="refl"><rect x="0" y="880" width="1600" height="120" fill="url(#fade)"/></mask>
    <pattern id="mull" x="600" y="160" width="40" height="36" patternUnits="userSpaceOnUse">
      <rect width="1.5" height="36" fill="#0E1115"/>
    </pattern>
    <pattern id="slab" x="0" y="160" width="40" height="36" patternUnits="userSpaceOnUse">
      <rect width="40" height="4" fill="#BFC5CB"/>
    </pattern>
    <pattern id="sideFloors" x="0" y="160" width="40" height="36" patternUnits="userSpaceOnUse" patternTransform="skewY(-21.8)">
      <rect width="40" height="3" fill="#2C333B"/>
    </pattern>
    <g id="towers">
      <!-- tower C (left, low) -->
      <polygon points="500,520 560,496 560,856 500,880" fill="#101318"/>
      <rect x="500" y="520" width="60" height="360" fill="url(#sideFloors)"/>
      <rect x="260" y="520" width="240" height="360" fill="url(#glass)"/>
      <rect x="260" y="520" width="240" height="360" fill="url(#mull)"/>
      <rect x="252" y="520" width="256" height="360" fill="url(#slab)"/>
      <g fill="#F5F5F3"><rect x="301" y="526" width="38" height="26" opacity=".8"/><rect x="421" y="598" width="38" height="26" opacity=".55"/><rect x="341" y="670" width="38" height="26" opacity=".85"/><rect x="461" y="742" width="38" height="26" opacity=".6"/><rect x="381" y="778" width="38" height="26" opacity=".8"/><rect x="261" y="634" width="38" height="26" opacity=".45"/></g>
      <rect x="252" y="508" width="256" height="12" fill="#2C333B"/>
      <!-- tower A (main) -->
      <polygon points="1000,120 1110,76 1110,836 1000,880" fill="#12161B"/>
      <rect x="1000" y="90" width="110" height="790" fill="url(#sideFloors)" opacity=".9"/>
      <polygon points="1000,120 1110,76 1110,836 1000,880" fill="none" stroke="#2C333B"/>
      <rect x="600" y="160" width="400" height="720" fill="url(#glass)"/>
      <rect x="600" y="160" width="400" height="720" fill="url(#mull)"/>
      <g fill="#F5F5F3">
        <rect x="681" y="166" width="38" height="26" opacity=".85"/><rect x="881" y="166" width="38" height="26" opacity=".6"/>
        <rect x="761" y="202" width="38" height="26" opacity=".9"/>
        <rect x="641" y="238" width="38" height="26" opacity=".7"/><rect x="921" y="238" width="38" height="26" opacity=".85"/>
        <rect x="801" y="274" width="38" height="26" opacity=".55"/>
        <rect x="601" y="310" width="38" height="26" opacity=".8"/><rect x="721" y="310" width="38" height="26" opacity=".9"/>
        <rect x="881" y="346" width="38" height="26" opacity=".75"/>
        <rect x="681" y="382" width="38" height="26" opacity=".6"/><rect x="961" y="382" width="38" height="26" opacity=".85"/>
        <rect x="801" y="418" width="38" height="26" opacity=".9"/>
        <rect x="641" y="454" width="38" height="26" opacity=".8"/><rect x="841" y="454" width="38" height="26" opacity=".55"/>
        <rect x="721" y="490" width="38" height="26" opacity=".85"/><rect x="921" y="490" width="38" height="26" opacity=".7"/>
        <rect x="601" y="526" width="38" height="26" opacity=".6"/><rect x="801" y="526" width="38" height="26" opacity=".9"/>
        <rect x="881" y="562" width="38" height="26" opacity=".8"/>
        <rect x="681" y="598" width="38" height="26" opacity=".9"/><rect x="761" y="598" width="38" height="26" opacity=".6"/>
        <rect x="961" y="634" width="38" height="26" opacity=".75"/>
        <rect x="641" y="670" width="38" height="26" opacity=".85"/><rect x="841" y="670" width="38" height="26" opacity=".7"/>
        <rect x="721" y="706" width="38" height="26" opacity=".9"/>
        <rect x="921" y="742" width="38" height="26" opacity=".8"/>
        <rect x="601" y="778" width="38" height="26" opacity=".7"/><rect x="801" y="778" width="38" height="26" opacity=".9"/>
      </g>
      <g fill="#4169E1"><rect x="921" y="418" width="38" height="26" opacity=".8"/><rect x="761" y="634" width="38" height="26" opacity=".7"/></g>
      <polygon points="600,160 720,160 1000,560 1000,760" fill="#F5F5F3" opacity=".045"/>
      <polygon points="600,330 600,420 1000,900 1000,820" fill="#F5F5F3" opacity=".03"/>
      <rect x="588" y="160" width="424" height="720" fill="url(#slab)"/>
      <rect x="588" y="120" width="424" height="40" fill="#20252B"/>
      <rect x="588" y="120" width="424" height="3" fill="#BFC5CB"/>
      <rect x="796" y="88" width="8" height="32" fill="#2C333B"/>
      <circle cx="800" cy="84" r="5" fill="#4169E1"/>
      <!-- tower B (right) -->
      <polygon points="1420,412 1484,386 1484,854 1420,880" fill="#12161B"/>
      <rect x="1420" y="380" width="64" height="500" fill="url(#sideFloors)" opacity=".9"/>
      <rect x="1180" y="412" width="240" height="468" fill="url(#glass)"/>
      <rect x="1180" y="412" width="240" height="468" fill="url(#mull)"/>
      <g fill="#F5F5F3"><rect x="1221" y="418" width="38" height="26" opacity=".85"/><rect x="1341" y="454" width="38" height="26" opacity=".6"/><rect x="1301" y="490" width="38" height="26" opacity=".8"/><rect x="1181" y="526" width="38" height="26" opacity=".7"/><rect x="1301" y="562" width="38" height="26" opacity=".9"/><rect x="1261" y="634" width="38" height="26" opacity=".75"/><rect x="1381" y="670" width="38" height="26" opacity=".85"/><rect x="1221" y="742" width="38" height="26" opacity=".6"/><rect x="1341" y="778" width="38" height="26" opacity=".8"/></g>
      <rect x="1172" y="412" width="256" height="468" fill="url(#slab)"/>
      <rect x="1172" y="400" width="256" height="12" fill="#2C333B"/>
      <!-- podium + lobby -->
      <rect x="540" y="828" width="620" height="52" fill="#20252B"/>
      <rect x="600" y="840" width="400" height="40" fill="#F5F5F3" opacity=".92"/>
      <g fill="#20252B"><rect x="660" y="840" width="3" height="40"/><rect x="740" y="840" width="3" height="40"/><rect x="820" y="840" width="3" height="40"/><rect x="900" y="840" width="3" height="40"/></g>
      <rect x="700" y="822" width="200" height="8" fill="#BFC5CB"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- distant city -->
  <g fill="#161A20">
    <rect x="0" y="760" width="90" height="120"/><rect x="100" y="720" width="70" height="160"/><rect x="180" y="790" width="60" height="90"/>
    <rect x="1500" y="740" width="100" height="140"/><rect x="1110" y="780" width="60" height="100"/>
  </g>
  <g fill="#F5F5F3" opacity=".35"><rect x="120" y="740" width="6" height="6"/><rect x="140" y="770" width="6" height="6"/><rect x="20" y="790" width="6" height="6"/><rect x="1530" y="770" width="6" height="6"/><rect x="1560" y="800" width="6" height="6"/></g>

  <use href="#towers"/>

  <!-- ground + reflection -->
  <rect x="0" y="880" width="1600" height="120" fill="url(#ground)"/>
  <g mask="url(#refl)"><use href="#towers" transform="translate(0 1760) scale(1 -1)"/></g>
  <rect x="0" y="879" width="1600" height="2" fill="#2C333B"/>
  <!-- landscape -->
  <g fill="#0B0D11">
    <circle cx="150" cy="852" r="34"/><circle cx="196" cy="842" r="42"/><circle cx="238" cy="858" r="28"/>
    <circle cx="560" cy="858" r="26"/><circle cx="1150" cy="860" r="24"/>
    <circle cx="1520" cy="848" r="38"/><circle cx="1566" cy="858" r="30"/>
  </g>
  <g fill="#0B0D11"><rect x="194" y="870" width="4" height="12"/><rect x="1518" y="870" width="4" height="12"/></g>
  <!-- people -->
  <g fill="#0B0D11"><rect x="760" y="862" width="6" height="18"/><circle cx="763" cy="858" r="4"/><rect x="842" y="864" width="6" height="16"/><circle cx="845" cy="860" r="4"/></g>
</svg>
