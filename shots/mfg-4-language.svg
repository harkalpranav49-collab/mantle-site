<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="Helvetica, Arial, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif">
  <rect width="320" height="200" fill="#0E1115"/>
  <g fill="none" stroke="#F5F5F3" stroke-opacity=".35" stroke-width="1.2">
    <rect x="30" y="130" width="260" height="10"/>
    <rect x="150" y="40" width="10" height="90"/><rect x="220" y="40" width="10" height="90"/>
    <rect x="145" y="30" width="90" height="18"/><rect x="175" y="48" width="30" height="37"/>
    <rect x="170" y="118" width="40" height="10"/><rect x="250" y="70" width="35" height="35" rx="3"/>
  </g>
  <rect x="62" y="108" width="30" height="22" fill="#4169E1" opacity=".6"/>
  <!-- language chips -->
  <g font-size="7.5" font-weight="700" text-anchor="middle">
    <rect x="14" y="14" width="44" height="16" rx="8" fill="#4169E1"/><text x="36" y="25" fill="#fff">मराठी</text>
    <rect x="62" y="14" width="40" height="16" rx="8" fill="none" stroke="#F5F5F3" stroke-opacity=".5"/><text x="82" y="25" fill="#F5F5F3">हिंदी</text>
    <rect x="106" y="14" width="30" height="16" rx="8" fill="none" stroke="#F5F5F3" stroke-opacity=".5"/><text x="121" y="25" fill="#F5F5F3">EN</text>
    <rect x="140" y="14" width="38" height="16" rx="8" fill="none" stroke="#F5F5F3" stroke-opacity=".5"/><text x="159" y="25" fill="#F5F5F3">عربي</text>
  </g>
  <!-- subtitles -->
  <rect x="40" y="152" width="240" height="34" rx="6" fill="#F5F5F3"/>
  <text x="160" y="167" text-anchor="middle" fill="#0E1115" font-size="11" font-weight="700">गार्ड लॉक करा, मग START दाबा</text>
  <text x="160" y="180" text-anchor="middle" fill="#788895" font-size="7" letter-spacing=".3">Lock the guard, then press START</text>
</svg>
